worker_processes auto;
worker_rlimit_nofile 200000;

events {
  # 10000 client + 10000 upstream (Cloud Run) = 20000 conns per worker; set
  # well above that. Pair with worker_rlimit_nofile so fds don't run out.
  worker_connections 65535;
  multi_accept on;
}

http {
  resolver 8.8.8.8 1.1.1.1 valid=300s ipv6=off;
  resolver_timeout 5s;

  log_format upstream_log '$remote_addr [$time_local] '
                          '"$request" $status upstream=$upstream_addr '
                          'rt=$request_time urt=$upstream_response_time';
  access_log /dev/stdout upstream_log;
  error_log  /dev/stderr warn;

  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;
  proxy_http_version 1.1;

  # Cloud Run upstream — talked to over HTTPS with SNI
  proxy_ssl_server_name on;
  proxy_ssl_protocols TLSv1.2 TLSv1.3;
  proxy_ssl_verify off;

  # Map upgrade header for WS pass-through
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  server {
    listen 8080 default_server;
    server_name _;
    client_max_body_size 50m;

    # ---------- REST API ----------
    # api-gateway sets global prefix "/api" so callers hit /api/auth/...,
    # /api/chat/rooms etc. We forward as-is.
    location /api/ {
      proxy_pass https://api-gateway-service-475254343480.asia-southeast1.run.app;

      # Cloud Run routes by Host header → MUST be the run.app hostname.
      proxy_set_header Host api-gateway-service-475254343480.asia-southeast1.run.app;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;

      proxy_connect_timeout 15s;
      proxy_send_timeout    60s;
      proxy_read_timeout    60s;
    }

    # ---------- Socket.IO / WebSocket ----------
    # socket service exposes /socket.io/ at root (no prefix). The chat
    # gateway uses namespace "/chat" which goes into the socket.io
    # handshake payload — path stays /socket.io/.
    location /socket.io/ {
      proxy_pass https://socket-service-475254343480.asia-southeast1.run.app;
      proxy_set_header Host socket-service-475254343480.asia-southeast1.run.app;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;

      # WS upgrade
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;

      # Cloud Run caps stream at 60min by default — keep idle long
      proxy_read_timeout  3600s;
      proxy_send_timeout  3600s;
      proxy_buffering off;
    }

    # Health probe
    location = /health {
      add_header Content-Type text/plain;
      return 200 "ok\n";
    }
  }
}
